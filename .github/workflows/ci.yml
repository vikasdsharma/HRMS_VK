name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: No secrets or databases tracked
        run: |
          if git ls-files | grep -E '(\.db$|\.key$|(^|/)\.env$|\.secret_key$)'; then
            echo "Secret or database file is tracked by git"; exit 1; fi
