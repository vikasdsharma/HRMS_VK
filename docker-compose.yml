# HRMS on a cloud VM:   cp .env.example .env   (fill it in)   then   docker compose up -d --build
# With automatic HTTPS (needs DNS for $DOMAIN pointing at this server, ports 80/443 open):
#   docker compose --profile https up -d --build
name: hrms

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hrms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      HRMS_DATABASE_URL: postgresql+psycopg://hrms:${POSTGRES_PASSWORD}@db:5432/hrms
      HRMS_DATA_DIR: /data
      HRMS_AUTO_MIGRATE: "0"
      HRMS_TRUST_PROXY: "1"
    volumes:
      - appdata:/data          # logs and backups (keys come from HRMS_SECRET_KEY / HRMS_FIELD_KEY in .env)
    ports:
      - "127.0.0.1:8000:8000"  # only reachable from this machine; the https profile / your load balancer fronts it

  caddy:                       # optional: automatic HTTPS (Let's Encrypt)
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:
  appdata:
  caddy_data:
