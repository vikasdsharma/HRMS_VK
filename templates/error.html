{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block body %}
<div class="card" style="max-width:560px;margin:50px auto;text-align:center">
<h1>{{ code }} &mdash; {{ title }}</h1><p>{{ message }}</p>
<p class="muted">Reference: <code>{{ rid }}</code></p>
<p><a class="btn" href="{{ url_for('dashboard') if me else url_for('login') }}">Back to {{ 'dashboard' if me else 'sign in' }}</a></p></div>
{% endblock %}
