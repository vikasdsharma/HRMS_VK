{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block anon %}{% from "_macros.html" import csrf %}
<div class="authwrap"><div class="card authcard">
  <div class="logo">HRMS</div><p class="muted" style="margin-top:0">Sign in to your organization</p>
  <form method="post" autocomplete="on">{{ csrf() }}
    <div class="field"><label for="u">Username</label><input id="u" name="username" autofocus required autocomplete="username"></div>
    <div class="field" style="margin-top:12px"><label for="p">Password</label><input id="p" type="password" name="password" required autocomplete="current-password"></div>
    <p><button class="btn" style="width:100%;justify-content:center">Sign in</button></p>
  </form>
  <p class="muted" style="font-size:12px;margin-bottom:0">Too many wrong attempts lock the account for a short time.</p>
</div></div>{% endblock %}
