{% extends "base.html" %}{% block title %}Change password{% endblock %}{% block body %}{% from "_macros.html" import csrf %}
<div class="page-head"><div><h1>Change password</h1></div></div>
<div class="card" style="max-width:460px">
{% if me.must_change_password %}<div class="alert warn">You must set a new password before you can continue.</div>{% endif %}
<form method="post">{{ csrf() }}
  <div class="field"><label for="old">Current password</label><input id="old" type="password" name="old" required autocomplete="current-password"></div>
  <div class="field" style="margin-top:12px"><label for="new">New password <span class="hint">at least 10 characters, letters and digits</span></label><input id="new" type="password" name="new" required minlength="10" autocomplete="new-password"></div>
  <div class="field" style="margin-top:12px"><label for="confirm">Repeat new password</label><input id="confirm" type="password" name="confirm" required minlength="10" autocomplete="new-password"></div>
  <p><button class="btn">Change password</button></p>
</form></div>{% endblock %}
